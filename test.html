<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; width: 390px; overflow-x: hidden; background: #eee; }
  .hero-visual { position: relative; width: 100%; min-height: 520px; background: #ddd; }
  .phone-home {
    position: absolute; width: 250px; height: 500px; background: red;
    left: 0; transform: rotate(-5deg);
  }
  .phone-route {
    position: absolute; width: 200px; height: 400px; background: blue;
    left: auto; right: -5%; transform: rotate(6deg);
  }
  .pill-ai { position: absolute; left: 0; top: 44%; width: 150px; height: 40px; background: yellow; }
</style>
</head>
<body>
  <div class="hero-visual">
    <div class="phone-home"></div>
    <div class="phone-route"></div>
    <div class="pill-ai"></div>
  </div>
</body>
</html>
